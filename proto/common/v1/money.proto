syntax = "proto3";

package common.v1;

option cc_enable_arenas = true;
option go_package = "github.com/antinvestor/common/v2/v1;commonv1";
option java_multiple_files = true;
option java_package = "commonv1";

// Money represents an amount of money with its currency type.
//
// Field numbers and types intentionally mirror google.type.Money so the
// wire format is identical — services that previously embedded
// google.type.Money can switch to common.v1.Money without coordinating
// deploys with their callers.
message Money {
  // The 3-letter ISO 4217 currency code (e.g. "KES", "USD", "EUR").
  string currency_code = 1;

  // The whole units of the amount. For example, if currency_code is "USD",
  // 1 unit is one US dollar.
  int64 units = 2;

  // Number of nano (10^-9) units of the amount. The value must be between
  // -999,999,999 and +999,999,999 inclusive.
  //
  // Sign rules:
  //   - If units is positive, nanos must be positive or zero.
  //   - If units is zero, nanos can be positive, zero, or negative.
  //   - If units is negative, nanos must be negative or zero.
  //
  // For example $-1.75 is represented as units=-1 and nanos=-750,000,000.
  int32 nanos = 3;
}

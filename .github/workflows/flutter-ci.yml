# Reusable workflow: Flutter CI (analyze + test)
# Automatically skips if ui/ directory doesn't exist.
name: Flutter CI
on:
  workflow_call:
    inputs:
      ui_dir:
        description: "Flutter UI directory"
        required: false
        default: "ui"
        type: string
      flutter_version:
        description: "Flutter version"
        required: false
        default: "stable"
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_ui: ${{ steps.detect.outputs.has_ui }}
    steps:
      - uses: actions/checkout@v6
      - id: detect
        run: |
          if [ -f "${{ inputs.ui_dir }}/pubspec.yaml" ]; then
            echo "has_ui=true" >> $GITHUB_OUTPUT
          else
            echo "has_ui=false" >> $GITHUB_OUTPUT
          fi

  flutter:
    needs: check
    if: needs.check.outputs.has_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_version }}
          cache: true

      - name: Install dependencies
        working-directory: ${{ inputs.ui_dir }}
        run: flutter pub get

      - name: Generate code
        working-directory: ${{ inputs.ui_dir }}
        run: |
          if grep -q 'build_runner' pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Analyze
        working-directory: ${{ inputs.ui_dir }}
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: ${{ inputs.ui_dir }}
        run: flutter test || true

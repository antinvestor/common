name: Auto-Merge Labeled PRs
on:
  workflow_call: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge')
    steps:
      # Idempotent: dependabot PRs are also handled by dependabot-auto-merge,
      # so the merge may already be queued or done by the time this runs.
      - name: Enable auto-merge
        run: |
          if out=$(gh pr merge "$PR" --auto --squash 2>&1); then
            echo "$out"; exit 0
          fi
          echo "$out"
          state=$(gh pr view "$PR" --json state,autoMergeRequest \
            --jq 'if .state == "MERGED" then "merged" elif .autoMergeRequest != null then "queued" else "" end')
          if [[ -n "$state" ]] || grep -qiE 'already in progress|already (been )?merged|auto-merge is already enabled' <<<"$out"; then
            echo "PR #$PR merge already ${state:-in progress} — nothing to do"
            exit 0
          fi
          exit 1
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  auto-merge-on-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'check_suite' || github.event_name == 'workflow_run'
    steps:
      - name: Find and merge labeled PRs
        uses: actions/github-script@v8
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'
            });
            for (const pr of prs) {
              if (!pr.labels.some(l => l.name === 'auto-merge')) continue;
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: pr.head.sha
              });
              const allPassed = checks.check_runs.every(c => c.status === 'completed' && c.conclusion === 'success');
              if (allPassed && checks.check_runs.length > 0) {
                try {
                  await github.rest.pulls.merge({
                    owner: context.repo.owner, repo: context.repo.repo,
                    pull_number: pr.number, merge_method: 'squash'
                  });
                  console.log(`Merged PR #${pr.number}`);
                } catch (e) { console.log(`Could not merge PR #${pr.number}: ${e.message}`); }
              }
            }

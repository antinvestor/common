name: Dependabot Auto-Merge
on:
  workflow_call: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Idempotent: the auto-merge label workflow may have queued it first.
      - run: |
          if out=$(gh pr merge --auto --squash "$PR_URL" 2>&1); then
            echo "$out"; exit 0
          fi
          echo "$out"
          done=$(gh pr view "$PR_URL" --json state,autoMergeRequest \
            --jq '.state == "MERGED" or .autoMergeRequest != null')
          if [[ "$done" == true ]] || grep -qiE 'already in progress|already (been )?merged|auto-merge is already enabled' <<<"$out"; then
            echo "merge already queued or in progress — nothing to do"
            exit 0
          fi
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

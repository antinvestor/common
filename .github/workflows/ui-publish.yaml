name: Publish Flutter UI to pub.dev
# Tag ui/core/v<version> publishes ui_core (antinvestor_ui_core). The local
# reusable workflow runs at this same commit; it refuses any ref that is not
# a ui/*/v* tag on main.
on:
  push:
    tags:
      - 'ui/*/v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/flutter-publish.yml

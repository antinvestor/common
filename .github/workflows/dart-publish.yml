# Reusable workflow: Publish Dart SDK packages to pub.dev
# Triggers on GitHub release (published). Discovers all pubspec.yaml files
# under sdk/dart/, runs analyze, and publishes each package.
#
# Usage:
#   jobs:
#     dart:
#       uses: antinvestor/common/.github/workflows/dart-publish.yml@main
#       secrets:
#         pub_credentials: ${{ secrets.PUB_DEV_CREDENTIALS }}
#
name: Publish Dart SDK
on:
  workflow_call:
    inputs:
      dart_sdk_version:
        description: "Dart SDK version"
        required: false
        default: "stable"
        type: string
      sdk_dir:
        description: "Directory containing Dart packages"
        required: false
        default: "sdk/dart"
        type: string
    secrets:
      pub_credentials:
        description: "pub.dev credentials JSON"
        required: true

jobs:
  discover-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@v6
      - id: find
        run: |
          PACKAGES=$(find ${{ inputs.sdk_dir }} -name "pubspec.yaml" -exec dirname {} \; | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
          echo "Found packages: $PACKAGES"

  publish:
    needs: discover-packages
    if: needs.discover-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.discover-packages.outputs.packages) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ inputs.dart_sdk_version }}

      - name: Set pub credentials
        run: |
          mkdir -p ~/.config/dart
          echo '${{ secrets.pub_credentials }}' > ~/.config/dart/pub-credentials.json

      - name: Get package info
        id: info
        working-directory: ${{ matrix.package }}
        run: |
          PKG_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          PKG_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "Publishing $PKG_NAME@$PKG_VERSION"

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: dart pub get

      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: dart analyze --no-fatal-warnings || true

      - name: Dry run
        working-directory: ${{ matrix.package }}
        run: dart pub publish --dry-run || true

      - name: Publish
        working-directory: ${{ matrix.package }}
        run: dart pub publish --force

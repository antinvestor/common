# Reusable workflow: Push OPL files to the deployments repo.
# Called by each service after generating OPL from proto.
#
# Usage:
#   jobs:
#     opl:
#       uses: antinvestor/common/.github/workflows/opl-push.yml@main
#       secrets:
#         deploy_token: ${{ secrets.DEPLOY_REPO_TOKEN }}
#
name: Push OPL to Deployments
on:
  workflow_call:
    inputs:
      opl_source:
        description: "Directory containing .opl.ts files (standard: opl/)"
        required: false
        default: "opl"
        type: string
      deploy_repo:
        description: "Deployments repository"
        required: false
        default: "antinvestor/deployments"
        type: string
      opl_dest:
        description: "OPL directory in deployments repo"
        required: false
        default: "manifests/namespaces/auth/authorization/opl"
        type: string
    secrets:
      deploy_token:
        description: "GitHub token with push access to deployments repo"
        required: true

jobs:
  push-opl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout service repo
        uses: actions/checkout@v6

      - name: Find OPL files
        id: find
        run: |
          FILES=$(find ${{ inputs.opl_source }} -name '*.opl.ts' 2>/dev/null | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "No OPL files found in ${{ inputs.opl_source }}"
            echo "has_opl=false" >> $GITHUB_OUTPUT
          else
            echo "Found: $FILES"
            echo "has_opl=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout deployments repo
        if: steps.find.outputs.has_opl == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.deploy_repo }}
          token: ${{ secrets.deploy_token }}
          path: _deployments

      - name: Copy OPL files
        if: steps.find.outputs.has_opl == 'true'
        run: |
          for f in $(find ${{ inputs.opl_source }} -name '*.opl.ts'); do
            name=$(basename "$f")
            echo "Copying $name"
            cp "$f" "_deployments/${{ inputs.opl_dest }}/$name"
          done

      - name: Regenerate combined ConfigMap
        if: steps.find.outputs.has_opl == 'true'
        run: |
          cd _deployments/manifests/namespaces/auth/authorization
          ./combine-opl.sh

      - name: Commit and push
        if: steps.find.outputs.has_opl == 'true'
        run: |
          cd _deployments
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No OPL changes to push"
          else
            git commit -m "chore: update OPL for ${{ github.repository }} (${{ github.sha }})"
            git push
            echo "OPL pushed to deployments repo"
          fi

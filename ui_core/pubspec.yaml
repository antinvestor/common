name: antinvestor_ui_core
description: >
  Shared Stitch design system and infrastructure for Antinvestor service UIs.
  Theme, widgets, auth, navigation, API helpers, and routing composition.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  antinvestor_api_common: ^1.52.0
  connectivity_plus: ^7.0.0
  csv: ^8.0.0
  connectrpc: ^1.0.0
  fixnum: ^1.1.0
  flutter_riverpod: ^3.2.1
  flutter_secure_storage: ^10.0.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  go_router: ^17.1.0
  google_fonts: ^6.2.1
  http: ^1.3.0
  logger: ^2.7.0
  protobuf: ^4.2.0
  riverpod_annotation: ^4.0.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
